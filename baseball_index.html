/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
b, strong { font-weight: 500; }
a { color: var(--color-ink); text-decoration-color: var(--color-muted); text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
a:hover { text-decoration-color: var(--color-accent); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-style: normal; font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.05; color: var(--color-ink); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { font-size: var(--text-3xl); } h2 { font-size: var(--text-2xl); } h3 { font-size: var(--text-lg); font-weight: 500; letter-spacing: -0.015em; line-height: 1.2; } h4, h3.subh { font-size: var(--text-md); font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
p { text-wrap: pretty; }
img, video { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tn { font-variant-numeric: tabular-nums lining-nums; }
.eyebrow { font-size: var(--text-sm); font-weight: 500; line-height: 1.35; color: var(--color-muted); }
.muted { color: var(--color-muted); } .faint { color: var(--color-muted); } .small { font-size: var(--text-sm); } .tiny { font-size: var(--text-xs); }
.good { color: var(--color-good); } .bad { color: var(--color-bad); } .warn { color: var(--color-warn); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(var(--space-md), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-md), env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(var(--space-lg), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-lg), env(safe-area-inset-right, 0px)); } }

/* ---------- the top bar: the club, the hour, five levels ---------- */
.board { position: relative; z-index: var(--z-sticky-nav); background: var(--color-paper); border-bottom: var(--rule-hair) solid var(--color-rule); padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 720px) { .board { position: sticky; top: 0; } }
.board .wrap { padding-block: var(--space-sm); }
.brow { display: flex; align-items: center; gap: var(--space-md); }
.club { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; flex: 1 1 auto; }
.club > div { min-width: 0; }
.club .chip { min-width: 40px; height: 40px; font-size: var(--text-sm); }
.club .nm { font: 500 var(--text-lg)/1.15 var(--font-display); letter-spacing: -0.015em; color: var(--color-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club .when { font-size: var(--text-sm); line-height: 1.35; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lights { display: flex; flex: none; }
.light { display: grid; gap: var(--space-3xs); align-content: start; min-width: 84px; padding-inline: var(--space-sm); border-left: var(--rule-hair) solid var(--color-rule); }
.light .k { font: 500 var(--text-xs)/1.3 var(--font-body); color: var(--color-muted); white-space: nowrap; }
.light .v { font: 400 var(--text-xl)/1.05 var(--font-display); letter-spacing: -0.03em; color: var(--color-ink); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.light .v .tiny { font: 500 var(--text-xs)/1 var(--font-body); letter-spacing: 0; color: var(--color-muted); }
.light .v.ok { color: var(--color-good); } .light .v.hot { color: var(--color-bad); }
.light .lv { display: block; height: 3px; margin-top: var(--space-2xs); border-radius: 2px; background: var(--color-paper-3); box-shadow: var(--shadow-sunk); overflow: hidden; }
.light .lv i { display: block; height: 100%; border-radius: inherit; background: var(--color-muted); }
.light .lv.lit i { background: var(--color-accent); }

/* ===== Core: RNG, math, formatting ===== */
const SAVE_VER = 1;
let G = null;            // the whole game state (JSON-serializable)

function R() { _rs = (_rs + 0x6D2B79F5) | 0; let t = Math.imul(_rs ^ (_rs >>> 15), 1 | _rs); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

function mulberry(a) { return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/* Run fn with a temporary seeded RNG (common random numbers for previews). Restores global RNG after. */
function withSeed(seed, fn) { const save = _rs; _rs = seed | 0; try { return fn(); } finally { _rs = save; } }

let _spare = null;
function rn(m = 0, s = 1) { if (_spare !== null) { const v = _spare; _spare = null; return m + s * v; } let u = 0, v = 0; while (u === 0) u = R(); v = R(); const r = Math.sqrt(-2 * Math.log(u)); _spare = r * Math.sin(2 * Math.PI * v); return m + s * r * Math.cos(2 * Math.PI * v); }
function ri(a, b) { return a + Math.floor(R() * (b - a + 1)); }
function pick(a) { return a[Math.floor(R() * a.length)]; }
function chance(p) { return R() < p; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(items, wf) { let tot = 0; for (const x of items) tot += Math.max(0, wf(x)); let r = R() * tot; for (const x of items) { r -= Math.max(0, wf(x)); if (r <= 0) return x; } return items[items.length - 1]; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sig = x => 1 / (1 + Math.exp(-x));
const logit = p => Math.log(p / (1 - p));
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const avg = (a, f = x => x) => a.length ? sum(a, f) / a.length : 0;
const sq = x => x * x;
const squash = (x, k) => k * Math.tanh(x / k);
function by(f, desc) { return (a, b) => desc ? f(b) - f(a) : f(a) - f(b); }
function range(n) { return Array.from({ length: n }, (_, i) => i); }

/* deterministic hash noise: same inputs -> same standard normal (for scouting fog) */
function hash32(a, b, c, d) { let h = 2166136261 ^ a; h = Math.imul(h ^ b, 16777619); h = Math.imul(h ^ c, 2246822519); h = Math.imul(h ^ d, 3266489917); h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16; return h >>> 0; }
function hashN(a, b, c, d) { const u = (hash32(a, b, c, d) + 1) / 4294967297, v = (hash32(d + 7, c + 3, b + 11, a + 5) + 1) / 4294967297; return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ===== Formatting ===== */
function fmtM(x, dp) { // x in $ millions
  if (x == null || isNaN(x)) return "—";
  const neg = x < 0, a = Math.abs(x);
  let s;
  if (a >= 1000) s = "$" + (a / 1000).toFixed(a >= 10000 ? 1 : 2) + "B";
  else if (a >= 1) s = "$" + a.toFixed(dp != null ? dp : (a >= 100 ? 0 : 1)) + "M";
  else s = "$" + Math.round(a * 1000) + "K";
  return neg ? "−" + s : s;
}
function fmtSigned(x, f = v => v.toFixed(1)) { return (x > 0 ? "+" : x < 0 ? "−" : "±") + f(Math.abs(x)); }
function fmtMs(x) { return (x > 0 ? "+" : x < 0 ? "−" : "") + fmtM(Math.abs(x)); }
function pct(x, dp = 0) { return (x * 100).toFixed(dp) + "%"; }
function oddsPct(p) { if (p >= 0.995) return ">99%"; if (p <= 0.005) return "<1%"; return Math.round(p * 100) + "%"; }
function f3(x) { if (!isFinite(x)) return "—"; const s = x.toFixed(3); return x < 1 && x >= 0 ? s.slice(1) : s; }
function f2(x) { return isFinite(x) ? x.toFixed(2) : "—"; }
function f1(x) { return isFinite(x) ? x.toFixed(1) : "—"; }
function ipStr(outs) { return Math.floor(outs / 3) + "." + (outs % 3); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ord(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function plural(n, w, pl) { return n + " " + (n === 1 ? w : (pl || w + "s")); }

/* ===== Atmosphere: the ballpark night drawn as slow light, the grain tile, the faders' glow =====

    if (m.k === "sell") { const cut = Math.max(0, m.pay0 - payroll(G.user)), tgt = m.target || 8; t.push(`<b>Owner's demand:</b> cut ${fmtM(tgt)} of payroll by July 31 — ${fmtM(cut)} so far. ${btn("tab", "Trades", { k: "market", v: "trade", cls: "sm" })}`); }
    if (m.k === "buy") t.push(`<b>Owner's demand:</b> add a difference-maker before the deadline.`);
  }
  const sg = (own().goals || []).find(g => g.k === "star");
  if (sg && ["early", "winter", "arb", "business", "spring"].includes(G.phase)) t.push(`<b>Owner's demand:</b> ${esc(sg.lbl.toLowerCase())}${starMet(sg) ? ` <span class="pill good">done</span>` : ""}.`);
  if (G.exp && G.exp.stage === "approved" && G.yr < G.exp.yr) t.push(`Expansion: ${G.exp.cities.map(a => cityByAb(a).city).join(" and ")} join the league in ${G.exp.yr}. You'll protect 15 players in that winter's expansion draft.`);
  if (G.relocPlan && G.relocPlan.tid === G.user) t.push(`<b>The club moves to ${cityByAb(G.relocPlan.ab).city} for the ${G.relocPlan.yr} season.</b>`);
  if (G.relocDeadline && G.relocDeadline.tid === G.user) t.push(`<b>Win a ballpark vote this November</b> or the club moves to ${cityByAb(G.relocDeadline.ab).city}. ${btn("tab", "Ballpark", { k: "biz", v: "park", cls: "sm" })}`);
  if (G.promise && G.promise.yr === G.yr && G.phase !== "review") t.push(`You told reporters ${G.promise.k === "po" ? "this club will play in October" : "this will be a winning season"}. Your owner and fans will remember.`);
  return t;
}

      <div class="opt"><div class="tx"><b>Offer a 10% cut (${fmtM(T.budget * 0.9)})</b><span class="small muted">Earns trust with owners who care about profit.</span></div><div class="od">✓</div>${btn("cut", "Offer", { k: 0.1, cls: "sm" })}</div></div>`}`)}

  if (ten.length) h += card("Arbitration tenders (deadline Nov 21)", `<p class="small muted">Tender a contract to keep a player through arbitration (his salary is set in February), or non-tender him and he becomes a free agent.</p><div class="opts">${ten.map(p => row(p, `Age ${p.age} · est. salary ${fmtM(p.ct.est)} · value to you ${fmtMs(playerValue(p, G.user))}`, tog("uten", p, p.uTender !== false, "Tender", "Non-tender"))).join("")}</div>`);

/* the owner's goals next to where you stand, using the same projection as the top bar and the analysts */
function rOwnerGoals() {
  const T = G.teams[G.user], inS = G.phase === "season" && G.sched;
  const od = inS ? (G.lastOdds && G.lastOdds.gi === G.gi ? G.lastOdds.v : null) : (G.phase === "spring" ? G.preOdds : null);
  const pw = inS ? (od ? od[G.user].w : T.w + (T.w + T.l ? T.w / (T.w + T.l) : 0.5) * (G.sched.games.length * 2 / nTeams() - T.w - T.l)) : projWins(G.user, G.user);
  const st = g => {
    switch (g.k) {
      case "wins": { const d = pw - g.t; return [`${inS ? "On pace for" : "Analysts project"} ${Math.round(pw)}`, d >= 1 ? "good" : d <= -3 ? "bad" : "warn"]; }
      case "po": return od ? [`Playoff odds ${oddsPct(od[G.user].po)}`, od[G.user].po >= 0.5 ? "good" : od[G.user].po < 0.25 ? "bad" : "warn"] : ["", ""];
      case "budget": { const pay = payroll(G.user); return [`Payroll ${fmtM(pay)}`, pay > g.t * 1.03 ? "bad" : "good"]; }
      case "fan": return [`Now ${T.fan}`, T.fan >= g.t ? "good" : T.fan >= g.t - 3 ? "warn" : "bad"];
      case "profit": return inS ? [`${fmtM(ytdOp(G.user))} so far`, ""] : ["", ""];
      case "riv": { const h = h2hFor(G.user, g.t); return h.w + h.l ? [`${h.w}-${h.l} so far`, h.w > h.l ? "good" : h.w < h.l ? "bad" : "warn"] : ["", ""]; }

  };
  return card(`${own().gmCtl ? "Your partners'" : "Your owner's"} goals for ${G.yr}`, own().goals.map(g => { const [v, c] = st(g); return `<div class="row sp note"><span>${esc(g.lbl)}</span>${v ? `<span class="small ${c}">${esc(v)}</span>` : ""}</div>`; }).join(""));

/* ---- how it works ---- */
function rHelp() {
  return mShell("How it works", `
  <p><b>Your job.</b> You run baseball and business operations. The manager plays the games (though you can write his lineup card if you like); you decide who is on the roster, what they're paid, and how the club makes and spends money. Each season your owner grades you on goals set at the November budget meeting. Trust below 18 gets you fired.</p>
  <p><b>The calendar.</b> Owner meeting → early offseason (options, qualifying offers, tenders, Rule 5 protection) → winter market (free agents sign week by week; winter meetings in mid-December; international signings January 15) → arbitration (February) → business plan → spring training → the season (All-Star Game and draft in mid-July, trade deadline July 31) → postseason (12 teams; top two division winners in each league get byes) → review.</p>
  <p><b>Positions.</b> Every hitter has a primary position. He can also cover nearby spots: shortstops can play second and third, second basemen short and third, center fielders both corners; catchers can only move to first, and first basemen only to the outfield corners. His card lists each position he can play with his defense there; the further from his primary spot, the worse it gets. Anyone can DH. The manager fills each lineup spot with whoever helps most, and the depth chart flags anyone playing out of position.</p>
  <p><b>Depth chart.</b> By default your manager writes the lineup card. On Roster › Depth chart you can take over any part of it: the batting order and positions (with a backup at each spot and how often regulars rest), the rotation (four, five or six men, in your order; the top four start in October) and the bullpen roles. If one of your choices is hurt or sent down, his backup or the manager's pick fills in until he's back. Each section shows how your card compares with the manager's.</p>
  <p><b>Ratings and fog.</b> Ratings use the 20–80 scouting scale (50 = average). You only ever see estimates. Analytics sharpens your view of your own players, pro scouting other clubs' players, amateur and international scouting the draft and 16-year-olds. A dashed grade is an estimate from a distance. Ratings are anchored to the league: each winter the big leagues' overall talent level is held where it was in 2026, so ratings (and the contracts built on them) don't creep upward over a long career.</p>
  <p><b>Wins.</b> Players produce WAR. A club of replacement-level players wins about 48 games; add the roster's WAR to get expected wins, then luck adds or subtracts several games. The projected wins in the top bar, your analysts' forecast and your owner's win target all use the same number: your roster as it stands, measured against a league where every club averages 81 wins (in the winter, rival clubs get credit for the holes they'll still fill). League totals are pinned near 1,000 WAR a season, and the run environment matches 2021–25 (about .245/.315/.400, 4.4 runs per team-game, 22–23% strikeouts).</p>
  <p><b>Money.</b> Revenue comes from tickets (attendance responds to winning, stars, your ballpark and price), concessions, premium seats, local TV, sponsorship, a central fund from national deals (about $125M a club), and the postseason. Clubs pay 48% of net local revenue into a pool split equally, so big markets subsidize small ones. The competitive balance tax charges 20%/30%/50% over the first threshold for first-time/second/third+ years, with surcharges at each higher threshold.</p>
  <p><b>Contracts.</b> Players are paid near the minimum for their first three years, go to arbitration from three to six years (Super Two at the top of the 2+ class), and reach free agency at six. Qualifying offers bring compensation picks. Options let you send a player down without waivers three seasons; after that he must clear waivers.</p>
  <p><b>Free agency.</b> Each player has an asking price (salary and years) and a floor that falls the longer he waits. He judges an offer by its salary per year against what he'd earn on his own terms over the same years; extra years add security (older players value that more) but never make up for a low salary. He also weighs winning, your city and player-experience spending. Your offer shows the chance he signs. Prices follow the money: the price of a win moves with what clubs can actually spend (budgets, held under a salary cap if there is one), so contracts can't run away from payrolls. Relievers earn much less per win than regulars, and near-replacement veterans only get minor-league deals (no guaranteed money, the minimum if you add them to the 40-man).</p>
  <p><b>Trades.</b> The other club values everyone through its own scouts and its plans: contenders pay for wins this year, rebuilders for cheap years of control. A popular player leaving costs fan interest. When you ask what one of your players would fetch, you can ask for the best offer, only prospects, or only major leaguers. Other clubs keep trade blocks too (Market › Trade blocks): rebuilding clubs shop veterans, clubs over budget shop salary, and from June on the clubs falling out of the race list their pending free agents. They take a little less for players on the block, and those are the players who move in July and on deadline day.</p>
  <p><b>Contract structure.</b> Under "Contract details" in an offer you can front- or back-load salaries, pay part of the deal as a signing bonus, defer up to 40% of each salary (paid over ten years after the deal; players discount deferred money and the tax counts it at present value), and add a club, player, mutual or vesting option, an opt-out or a no-trade clause. Player-friendly terms make an offer more attractive. The Payroll plan (Roster tab) shows every commitment for five seasons, with estimated arbitration raises and tax bills.</p>
  <p><b>Calls and the wire.</b> Other clubs phone with trade offers and agents call with competing bids; both expire, so answer them from the Office. Draft picks for the next two drafts can be traded. Players designated by other clubs go on waivers, where the worst record claims first; you can claim them from the Market tab and pick players in the Rule 5 draft from your own list.</p>
  <p><b>Ownership.</b> Owners have personalities and make demands: a star signing, a midseason managerial change, a salary dump when the season is lost. Family owners eventually hand the club to an heir with different priorities, and owners carrying heavy debt can face capital calls. What you tell reporters at press conferences moves fan interest and trust, and public promises are remembered at the review.</p>
  <p><b>Business deals.</b> Sell a jersey patch and ballpark naming rights (renaming a historic park angers fans), set the season-ticket discount (a bigger base fills seats and protects you in a bad year, at a cost per ticket), and keep pushing for a new ballpark. Fail at the polls enough times and your owner may look at another city.</p>
  <p><b>Stats and history.</b> Box scores and a game log for every game your club plays, team and league stats with park-adjusted OPS+ and ERA+ and FIP, franchise and league records, All-Star Games, a Hall of Fame vote each winter, and a Top 100 prospect list with farm-system rankings.</p>
  <p><b>Agents and contract talks.</b> Every player has an agent with a style: hardball agents squeeze every dollar and take clients to free agency, hometown agents encourage players to stay, dealmakers like quick deals, ring chasers steer clients to contenders. When you make an offer, the agent answers right away: yes, a counteroffer you can accept or build on, or a brush-off if you lowball. Each round costs patience, and pushing too hard ends talks for the week. Your relationship with each agency follows you from job to job (Market › Agents).</p>
  <p><b>The clubhouse.</b> Players have personalities: leaders, mentors, competitors, loyal types, and the occasional clubhouse problem. Team chemistry is worth about a win or two either way and helps young players develop. Unhappy players ask for trades or new contracts and prospects who think they're ready complain to the press; your answers and promises are remembered (Roster › Clubhouse).</p>
  <p><b>Medical.</b> Your medical staff grades each player's durability and runs physicals: a red flag after a signing lets you go ahead, restructure or void the deal. Serious injuries come with choices (surgery or a riskier faster fix), and you can push any rehab along at the risk of a setback. Better medical staff means better odds.</p>
  <p><b>Deadline day.</b> On July 31 the clock runs from 9 AM to 6 PM, one hour at a time: rumors turn into deals, offers to you expire within hours, and the final hour is a scramble. Put rival players on your deadline list to be alerted if someone else grabs them. The sim also stops on the morning of an in-season owners' vote and, if you leave the winter meetings early, the week before international signing day.</p>
  <p><b>Farm clubs, academies, ballparks.</b> Your four affiliates have their own parks, crowds and books; better facilities develop prospects faster, and you can buy a club or upgrade its park. Academies in the Dominican Republic and Venezuela sharpen your view of those prospects, cut their bonuses and turn up exclusive finds; posted players from Asia have 30 days to sign. When a new ballpark is approved you design it (capacity, premium seats, roof, fences, turf, district, style) and can keep changing it until Opening Day of the season it opens.</p>
  <p><b>Owners' meetings and the yearbook.</b> Owners vote in November and June on revenue sharing, anti-tanking rules, a ballpark fund, streaming deals and more, and elect a commissioner every five years. Cast your vote and work the phones, call in a favor or trade votes. Each season ends with a yearbook: the headlines, your best and worst moves, leaders, awards and your franchise timeline (League › History).</p>
  <p><b>Rival GMs.</b> Every other club's front office is run by a general manager with a style (Market › Front offices): sharks and patient builders drive hard bargains, dealmakers and all-in GMs say yes more often, analytics shops prize prospects and picks, old-school GMs want proven veterans. Each one remembers your trades, graded on the WAR each side got afterward: fleece someone and he'll make you pay next time. Lowball offers annoy them. GMs get fired and hired every winter. "Find a third team" in the trade builder looks for a club to take your player and pay your partner, for three-team deals.</p>
  <p><b>Ballpark village.</b> Build bars, a plaza, shops, a music venue, a hotel, apartments or an office tower on the lots around your park (Business › Village). Pay for it yourself or with a developer partner; bigger projects need the city council. Real-estate income stays outside revenue sharing, and a bigger district lifts attendance, concessions and franchise value. Offices and hotels rise and fall with the economy.</p>
  <p><b>Promotions.</b> Once the schedule comes out in the winter, book giveaways, fireworks, dollar dogs and theme nights on specific home dates (Business › Promotions). Each date shows a forecast crowd: promotions pay off where seats would otherwise be empty, not on sellouts. Repeats lose their punch, and so does a crowded calendar. Rivals, big-market clubs and stars draw bigger crowds on their own.</p>
  <p><b>Spring training and games abroad.</b> Your club trains in Arizona or Florida (Business › Spring & abroad). Better facilities help young players and trim early injuries; leases come up for renewal, when cities bid for you. The league stages series in London, Tokyo, Mexico City and elsewhere: hosting costs two home dates but pays and grows your global fan base, which lifts sponsorship and merchandise. Expect a few days of jet lag afterward. You can also apply to host.</p>
  <p><b>Heritage.</b> Every club has a history: founding year, titles, retired numbers, a ring of honor and statues (Business › Heritage). When stars who gave your club real years retire, you can retire their numbers, induct them or put up a statue; ceremonies land on your promotions calendar. Tradition helps fans stick around through losing seasons. Anniversary years and throwback uniforms sell tickets and merchandise.</p>
  <p><b>Your contract and the job market.</b> You earn a salary and bonuses and save part of it (Office › Your career › Your finances). A good review brings an extension offer you can accept, negotiate or turn down. When your contract runs out you may not be renewed; if you're fired or let go, you interview with clubs that changed GMs and pick an offer. Under contract, you can still ask your owner for permission to interview elsewhere after the season. Owners sometimes sell you a stake in the club, and if the club is sold, a GM with a stake (or the money) can lead the bid and become the control owner: no one can fire you then, but your partners grade you and everyone covers losses.</p>
  <p><b>Rule changes.</b> The owners' meetings also vote on playing rules: an automated strike zone, bigger bases, a shorter pitch clock, the extra-innings runner, a deadened ball, a limit on pitching changes. Each changes how games play out (League › Rules & office lists what's in effect).</p>
  <p><b>Coaches and the front office.</b> Every club has a pitching coach, a hitting coach and a bench coach (Business › Staff). Each has a rating and a philosophy: a launch-angle hitting coach adds power and strikeouts, a contact coach the opposite; a spin-first pitching coach chases strikeouts, an arm-care coach keeps pitchers healthy. Good coaches are worth about half a win each and help your big leaguers and Triple-A players develop in their specialty. You can also hire up to three senior front-office people (a negotiator, a trade specialist, a capologist, an analyst, a business VP). They grow on the job; the best get hired away as general managers, which gives you friendly voices around the league.</p>
  <p><b>Tickets and concessions.</b> Your ballpark sells three tiers: bleachers, the lower bowl and club seats, each with its own buyers and capacity; sellouts spill buyers into cheaper sections. Fans judge you on an index of all three prices. You also set food and drink prices, choose who runs the stands (yourself, a hospitality partner who pays a signing bonus, or local vendors fans love) and can upgrade the menu.</p>
  <p><b>Contract insurance.</b> Insure big guaranteed contracts against long injuries (Business › Finances): a policy pays 75% of salary for days missed beyond the first 60 of a season. Premiums reflect age, position and medical history and rise after a claim; underwriters exclude body parts that have been hurt before. Policies are written each year before Opening Day.</p>
  <p><b>Community and city hall.</b> Youth academies, a foundation, donated seats and neighborhood investment build goodwill (Business › Community). Goodwill and your relationship with the mayor help ballpark votes and village zoning. City hall brings requests (a transit stop, a ticket tax, a policing bill), and every four years you can back a mayoral candidate.</p>
  <p><b>Rivalries.</b> Every pair of clubs has a rivalry rating that starts with geography and divisions and grows with pennant races, October meetings, lopsided season series, stars who defect and the occasional brawl (League › Rivalries). Bitter rivals draw bigger crowds, and fans care whether you win the season series.</p>
  <p><b>Almanac.</b> League › Almanac charts your club's seasons (wins, payroll, attendance, profit, fan interest, value) against the league average, payroll against wins for any season, and how the game itself has changed. Hover a chart for exact numbers or open its table.</p>
  <p><b>Expansion.</b> Around 2029–31 the owners vote on two new clubs. If it passes, each club protects 15 players in an expansion draft, and the leagues realign into four divisions of four.</p>
  <p><b>Difficulty.</b> Owner patience, how hard rival front offices bargain and how much scouting fog you face can be changed at any time from the menu.</p>
  <p><b>Labor.</b> The 2022–26 agreement expires December 1, 2026. Your vote on the owners' stance shifts the odds of a cap, a floor or the current system, and how long a lockout lasts. A long lockout can cancel games.</p>
  <p class="small muted">All clubs, players, owners and officials are fictional. Figures are approximations calibrated to public 2021–25 MLB data (league statistics, Cot's-style contract rules, Forbes-style franchise finances).</p>`);

  ${gm.eqG && gm.eqG.tid === G.user ? `<p class="small muted">Equity grant: ${gm.eqG.per}% of the club vests at the end of each season for ${plural(gm.eqG.left, "more year")}.</p>` : ""}

}
MODALS.money = () => {
  const gm = gmFin(), eq = gm.eq;
  const rows = (gm.ledger || []).slice().reverse().map(L => [L.yr, tab(L.tid), fmtM(L.sal), L.bonus ? fmtM(L.bonus) : "—", L.dist ? `<span class="good">${fmtM(L.dist)}</span>` : L.call ? `<span class="bad">−${fmtM(L.call)}</span>` : "—", L.vest ? `+${L.vest}%` : L.diluted ? `<span class="bad">−${L.diluted}%</span>` : "—", fmtM(L.cash), L.stake ? fmtM(L.stake) : "—"]);

      ${x.tries < 2 ? [["money", "Ask for 15% more salary"], ["years", "Ask for another year"], ["equity", "Ask for equity in the club"]].map(([k, l]) => `<div class="opt"><div class="tx"><b>${l}</b><span class="small muted">If he says no, trust slips a little and the offer stands.</span></div><div class="od">${oddsPct(counterOdds(k))}</div>${btn("extCtr", "Ask", { k, cls: "sm" })}</div>`).join("") : ""}
      <div class="opt"><div class="tx"><b>${gm.yrsLeft <= 0 ? "Turn it down and test the market" : "Turn it down for now"}</b><span class="small muted">${gm.yrsLeft <= 0 ? "Your contract is up. You'll become a free agent when the offseason begins." : `You're signed through ${contractThru()} either way.`}</span></div>${btn("extDec", "Decline", { cls: "sm" })}</div></div>`));
    else out.push(card("Contract extension", x.st === "acc" ? `<p class="good">Agreed: ${term}. It takes effect when the offseason begins.</p>` : `<p>You declined: ${term}.${gm.yrsLeft <= 0 ? " You'll be a free agent when the offseason begins." : ""}</p>${btn("extReopen", "Reconsider", { cls: "sm" })}`));
  }
  if (G.salePend) {
    const v = clubVal(G.user), pct = stakePct();
    const bids = [0, 0.05, 0.1].map(pr => { const b = bidTerms(pr); return `<div class="opt"><div class="tx"><b>Bid ${fmtM(b.price)}${pr ? ` (+${pr * 100}%)` : " (appraised value)"}</b><span class="small muted">Partners put in about ${fmtM(b.partners)}; you'd put in ${fmtM(b.topUp)} for ${f2(b.buyPct)}% more of the club${b.canTop ? "" : `, more than you can raise (${fmtM((G.gm.cash + loanRoom()) * 2)} with acquisition loans)`}. The seller takes it ${oddsPct(b.sellerOK)}; owners approve ${oddsPct(b.leagueOK)}.</span></div><div class="od">${oddsPct(b.canTop ? b.odds : 0)}</div>${btn("bid", "Bid", { k: pr, cls: "sm pri", dis: !b.funded || !b.canTop })}</div>`; }).join("");
    out.push(card("The club is for sale", `<p>${esc(G.salePend.old)} has decided to sell the ${esc(tname(G.user))} (appraised at ${fmtM(v)}). Another group has made an offer. ${pct ? `You own ${f2(pct)}%.` : ""} You could put together a group of investors and buy it yourself.</p><div class="opts">${bids}<div class="opt"><div class="tx"><b>Stay out of it</b><span class="small muted">The sale goes through; you work for the new owner.</span></div>${btn("bid", "Pass", { k: "pass", cls: "sm" })}</div></div>`, "event"));
  }
  if (G.saleRes) {
    const r = G.saleRes;
    out.push(card("The sale", r.won ? `<p class="good"><b>Your group bought the club for ${fmtM(r.price)}.</b> You're the control owner and the GM. Nobody can fire you now, but your partners grade you each year and losses come out of everyone's pockets, including yours.</p>` : r.passed ? `<p>You stayed out of the bidding.</p>` : `<p class="bad">Your bid fell short: ${r.why === "league" ? "the other owners voted it down." : r.why === "money" ? "your group couldn't raise the money." : "the seller took the other offer."}</p>`));
  }
  if (!isCtrl()) {
    const ops = jobOpenings();
    out.push(card("The GM carousel", `${ops.length ? `<p>${ops.length} club${ops.length > 1 ? "s" : ""} changed general managers: ${ops.map(o => esc(tname(o.tid))).join(", ")}.</p>` : `<p class="muted">No other front offices have openings this winter.</p>`}${gm.pend ? `<p><b>You're leaving for the ${esc(tname(gm.pend.tid))}.</b></p>` : ""}${btn("jmOpen", "Open the job market", { cls: "sm" })}`));
  }
  return out.join("");
}

    <div class="stack">${card("Flashpoints", log || `<p class="muted">Nothing yet. Give it a pennant race.</p>`)}${card("The league's fiercest", top)}</div></div></div>`;
}
/* ---- small chart kit: thin lines, end labels, hover crosshair, table fallback ---- */
function niceTicks(lo, hi, n = 3) {
  if (hi === lo) { hi = lo + 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
function lineChart(o) {
  const W = 320, H = o.h || 144, L = 42, Rr = 46, Tt = 10, B = 26;
  const all = o.series.flatMap(s => s.pts.map(p => p[1])).filter(v => v != null);
  const xs = [...new Set(o.series.flatMap(s => s.pts.map(p => p[0])))].sort((a, b) => a - b);
  if (xs.length < 2 || !all.length) return `<p class="small muted">${esc(o.empty || "Not enough seasons yet.")}</p>`;
  let lo = Math.min(...all, o.zero ? 0 : Infinity), hi = Math.max(...all, o.ref != null ? o.ref : -Infinity);
  if (o.ref != null) lo = Math.min(lo, o.ref);
  const ticks = niceTicks(lo, hi, 3); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = x => L + (x - xs[0]) / (xs[xs.length - 1] - xs[0]) * (W - L - Rr), Y = y => Tt + (1 - (y - lo) / (hi - lo)) * (H - Tt - B);
  const fmt = o.fmt || (v => String(v));
  let tl = ticks.map(fmt);
  if (new Set(tl).size < tl.length) { const step = ticks[1] - ticks[0], dec = Math.max(0, -Math.floor(Math.log10(step))); tl = ticks.map(t => (o.pctTicks ? (t * 100).toFixed(Math.max(0, dec - 2)) + "%" : t.toFixed(dec))); }
  const grid = ticks.map((t, i) => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(Y(t) + 3.5).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(tl[i])}</text>`).join("");
  const xl = [xs[0], xs[Math.floor((xs.length - 1) / 2)], xs[xs.length - 1]].filter((v, i, a) => a.indexOf(v) === i).map(x => `<text x="${X(x).toFixed(1)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${x}</text>`).join("");
  const lines = o.series.map(s => { const pts = s.pts.filter(p => p[1] != null); if (!pts.length) return ""; const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" "); const e = pts[pts.length - 1]; return `<path d="${d}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(e[0]).toFixed(1)}" cy="${Y(e[1]).toFixed(1)}" r="4" fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>${s.label !== false ? `<text x="${(X(e[0]) + 7).toFixed(1)}" y="${(Y(e[1]) + 3.5).toFixed(1)}" font-size="10.5" font-weight="600" fill="var(--ink)">${esc(fmt(e[1]))}</text>` : ""}`; }).join("");
  const ref = o.ref != null ? `<line x1="${L}" x2="${W - Rr}" y1="${Y(o.ref).toFixed(1)}" y2="${Y(o.ref).toFixed(1)}" stroke="var(--faint)" stroke-width="1"/>` : "";
  const bw = (W - L - Rr) / Math.max(1, xs.length - 1);
  const bands = xs.map(x => { const tip = [String(x)].concat(o.series.map(s => { const p = s.pts.find(q => q[0] === x); return p && p[1] != null ? `${fmt(p[1])}\t${s.name}\t${s.c}` : null; }).filter(Boolean)).join("\n"); return `<g class="hb" tabindex="0" data-tip="${esc(tip)}"><rect x="${(X(x) - bw / 2).toFixed(1)}" y="${Tt}" width="${bw.toFixed(1)}" height="${H - Tt - B}" fill="transparent"/><line class="xh" x1="${X(x).toFixed(1)}" x2="${X(x).toFixed(1)}" y1="${Tt}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/></g>`; }).join("");
  const table = `<details class="small" style="margin-top:4px"><summary>Table</summary>${table_([{ h: "Season" }].concat(o.series.map(s => ({ h: s.name, r: 1 }))), xs.map(x => [x].concat(o.series.map(s => { const p = s.pts.find(q => q[0] === x); return p && p[1] != null ? fmt(p[1]) : "—"; }))))}</details>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(o.title || "")}">${grid}${xl}${ref}${lines}${bands}</svg>${table}`;
}
function table_(cols, rows) { return table(cols, rows, { sort: false }); }
function legendRow(items) { return `<div class="row" style="gap:14px;margin:2px 0 6px">${items.map(([lbl, c, dot]) => `<span class="small" style="display:inline-flex;align-items:center;gap:6px">${dot ? `<svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="var(${c})"/></svg>` : `<svg width="16" height="4" aria-hidden="true"><line x1="0" x2="16" y1="2" y2="2" stroke="var(${c})" stroke-width="2"/></svg>`}${esc(lbl)}</span>`).join("")}</div>`; }
function scatterChart(pts, o) {
  const W = 400, H = 250, L = 44, Rr = 26, Tt = 12, B = 28;
  if (pts.length < 3) return `<p class="small muted">Not enough data.</p>`;
  const xt = niceTicks(Math.min(...pts.map(p => p.x)), Math.max(...pts.map(p => p.x)), 4), yt = niceTicks(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)), 4);
  const x0 = xt[0], x1 = xt[xt.length - 1], y0 = yt[0], y1 = yt[yt.length - 1];
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - Rr), Y = y => Tt + (1 - (y - y0) / (y1 - y0)) * (H - Tt - B);
  const grid = yt.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(Y(t) + 3.5).toFixed(1)}" font-size="11" text-anchor="end" fill="var(--muted)">${t}</text>`).join("") + xt.map(t => `<text x="${X(t).toFixed(1)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="var(--muted)">${esc(o.xfmt(t))}</text>`).join("");
  const order = pts.slice().sort((a, b) => (a.c ? 1 : 0) - (b.c ? 1 : 0));
  const dots = order.map(p => `<g class="hd" tabindex="0" data-tip="${esc(`${p.tip}\n${o.yfmt(p.y)}\t${o.ylbl}\t${p.c || "--faint"}\n${o.xfmt(p.x)}\t${o.xlbl}\t${p.c || "--faint"}`)}"><circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="12" fill="transparent"/><circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="var(${p.c || "--faint"})" stroke="var(--panel)" stroke-width="2"/>${p.lbl ? `<text x="${(X(p.x) + 8).toFixed(1)}" y="${(Y(p.y) - 6).toFixed(1)}" font-size="11.5" font-weight="600" fill="var(--ink)">${esc(p.lbl)}</text>` : ""}</g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;height:auto;display:block" role="img" aria-label="${esc(o.title || "")}">${grid}${dots}</svg>`;
}
/* hover tooltips for every chart (text set with textContent) */
(function () {
  if (typeof document === "undefined") return;
  let tip = null;
  const show = (el, x, y) => {
    if (!tip) { tip = document.createElement("div"); tip.className = "ctip"; document.body.appendChild(tip); }
    tip.textContent = "";
    const lines = (el.dataset.tip || "").split("\n");
    const h = document.createElement("div"); h.className = "ctip-h"; h.textContent = lines[0]; tip.appendChild(h);
    for (const ln of lines.slice(1)) {
      const [v, name, c] = ln.split("\t"); const row = document.createElement("div"); row.className = "ctip-r";
      const key = document.createElement("span"); key.className = "ctip-k"; key.style.background = `var(${c || "--muted"})`;
      const b = document.createElement("b"); b.textContent = v; const n = document.createElement("span"); n.className = "muted"; n.textContent = " " + (name || "");
      row.append(key, b, n); tip.appendChild(row);
    }
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, x + 14) + "px"; tip.style.top = Math.max(8, y - r.height - 10) + "px";
  };
  const hide = () => { if (tip) tip.style.display = "none"; };
  document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest(".chart [data-tip]"); if (el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest(".chart [data-tip]"); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
  document.addEventListener("focusout", hide);
})();
/* ---- the almanac ---- */
function rAlmanac() {
  const T = G.teams[G.user], U = G.user;
  const hs = T.hist.slice(-30);
  const avgOf = (yr, k) => { const a = almYear(yr); return a ? a[k] : null; };
  const ser = (k, f) => hs.map(h => [h.yr, f ? f(h) : h[k]]);
  const lg = k => hs.map(h => [h.yr, avgOf(h.yr, k)]);
  const two = (title, k, fmt) => card(title, legendRow([["Your club", "--cA"], ["League average", "--cB"]]) + lineChart({ title, fmt, series: [{ name: "Your club", c: "--cA", pts: ser(k) }, { name: "League average", c: "--cB", pts: lg(k) }] }));
  const one = (title, pts, fmt, extra) => card(title, lineChart(Object.assign({ title, fmt, series: [{ name: title, c: "--cA", pts }] }, extra || {})));
  const ys = almYears(), yr = UI.almYr && ys.includes(UI.almYr) ? UI.almYr : ys[ys.length - 1];
  const champ = (G.hist.find(x => x.yr === yr) || {}).champ;
  const sc = G.teams.map(t => { const h = t.hist.find(x => x.yr === yr); return h ? { x: h.pay, y: h.w, tip: `${tname(t.id)}, ${yr}`, c: t.id === U ? "--cA" : t.id === champ ? "--cB" : null, lbl: t.id === U ? tab(t.id) : t.id === champ ? `${tab(t.id)} (champs)` : null } : null; }).filter(Boolean);
  const trendYs = Object.keys(G.alm || {}).map(Number).sort((a, b) => a - b);
  const tr = (k, title, fmt) => one(title, trendYs.map(y => [y, G.alm[y][k]]), fmt, { empty: "Trends fill in as seasons are played." });
  const titles = {}; for (const h of G.hist) if (h.champ != null && h.yr >= 2027) titles[h.champ] = (titles[h.champ] || 0) + 1;
  const tRows = Object.entries(titles).sort((a, b) => b[1] - a[1]).map(([t, n]) => [`${tchip(+t, 18)} ${esc(tname(+t))}`, n]);
  const deals = (G.gmDeals || []).filter(d => d.done).sort((a, b) => b.net - a.net);
  const dRow = d => [d.yr, `${tab(d.tid)}`, esc(d.theirs.map(s => s.n).join(", ") || "—"), esc(d.mine.map(s => s.n).join(", ") || "—"), `<span class="${d.net >= 3 ? "good" : d.net <= -3 ? "bad" : ""}">${d.net > 0 ? "+" : ""}${f1(d.net)}</span>`];
  return `<div class="stack"><p class="small muted">The ${esc(tname(U))} through the years, and the league around them. Hover a chart for exact numbers, or open its table.</p>
    <div class="grid g2">${one("Wins", ser("w"), v => String(Math.round(v)), { ref: 81 })}${two("Payroll", "pay", v => fmtM(v, 0))}${two("Average attendance", "att", v => (v / 1000).toFixed(0) + "K")}${one("Operating income", ser("op"), v => fmtM(v, 0), { zero: true })}${one("Fan interest", ser("fan"), v => String(Math.round(v)))}${two("Franchise value", "val", v => fmtM(v, 1))}</div>
    ${card(`Payroll and wins, ${yr}`, `<div class="row" style="gap:4px;margin-bottom:6px">${ys.slice(-12).map(y => btn("almYr", String(y), { k: y, cls: y === yr ? "on sm" : "sm" })).join("")}</div>${legendRow([["Your club", "--cA", 1], ["Champion", "--cB", 1], ["Other clubs", "--faint", 1]])}${scatterChart(sc, { title: `Payroll and wins in ${yr}`, xfmt: v => fmtM(v, 0), yfmt: v => `${v} wins`, xlbl: "Payroll", ylbl: "" })}<p class="small muted">Payroll across, wins up. Money buys wins, loosely: clubs above the crowd are getting value; clubs below it are paying for wins they aren't getting.</p>`)}
    <div class="grid g2">${tr("rpg", "Runs per team-game", v => v.toFixed(2))}${tr("hrpg", "Home runs per team-game", v => v.toFixed(2))}${card("Strikeout rate", lineChart({ title: "Strikeout rate", fmt: v => (v * 100).toFixed(1) + "%", pctTicks: true, empty: "Trends fill in as seasons are played.", series: [{ name: "Strikeout rate", c: "--cA", pts: trendYs.map(y => [y, G.alm[y].kpct]) }] }))}${tr("sbpg", "Stolen bases per team-game", v => v.toFixed(2))}</div>
    <div class="grid g2">${card("Titles since 2027", tRows.length ? table([{ h: "Club", nm: 1 }, { h: "Titles", r: 1 }], tRows, { sort: false }) : `<p class="muted">No champions crowned yet.</p>`)}
    ${card("Your trades, best and worst", deals.length ? table([{ h: "Year" }, { h: "With" }, { h: "You got", nm: 1 }, { h: "You gave", nm: 1 }, { h: "Net WAR", r: 1 }], deals.slice(0, 3).concat(deals.length > 3 ? deals.slice(-Math.min(3, deals.length - 3)) : []).map(dRow), { sort: false }) : `<p class="muted">Trades are graded after a season.</p>`)}</div></div>`;
}
ACT.almYr = k => { UI.almYr = +k; };

window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
